<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Aura | Under Maintenance</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#f8f9ff,#e6ecff);
overflow:hidden;
position:relative;
}

/* 🔥 Background Logo */
.bg-logo{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:450px;
opacity:0.2;
z-index:1;
filter:grayscale(100%) contrast(120%) blur(1px);
pointer-events:none;
}

/* Glow Effects */
body::after{
content:"";
position:absolute;
width:400px;
height:400px;
background:radial-gradient(circle,#ff2e63,transparent 70%);
bottom:-100px;
right:-100px;
filter:blur(100px);
opacity:0.3;
animation:move 10s infinite alternate;
}

@keyframes move{
0%{transform:translate(0,0);}
100%{transform:translate(50px,50px);}
}

/* Card */
.container{
background:white;
padding:50px 60px;
border-radius:20px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,0.1);
max-width:500px;
z-index:2;
}

/* Logo Text */
.logo{
font-size:28px;
font-weight:700;
background:linear-gradient(45deg,#ff2e63,#6c63ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:15px;
}

/* Heading */
h1{
font-size:24px;
margin-bottom:15px;
color:#222;
}

/* Subtext */
p{
font-size:15px;
color:#555;
margin-bottom:25px;
line-height:1.6;
}

/* Loader */
.loader{
width:100%;
height:6px;
background:#eee;
border-radius:10px;
overflow:hidden;
}

.loader span{
display:block;
height:100%;
width:0%;
background:linear-gradient(90deg,#ff2e63,#6c63ff);
animation:load 3s infinite;
}

@keyframes load{
0%{width:0%;}
50%{width:80%;}
100%{width:0%;}
}

/* Footer */
.footer{
margin-top:20px;
font-size:12px;
color:#888;
}
</style>

</head>

<body>

<!-- 🔥 Background Logo -->
<img src="logo.png" class="bg-logo">

<div class="container">

<div class="logo">Design Aura</div>

<h1>Website Maintenance Underway 🚧</h1>

<p>
We're currently working on something big and exciting.<br>
Our new experience is coming soon — stay tuned!
</p>

<div class="loader">
<span></span>
</div>

<div class="footer">
© 2026 Design Aura | Ayaan Kapoor
</div>

</div>

</body>
</html>
